# Production profile for Azure Web App (or any cloud host).
# Set IAM_SERVICE_URL and ORGANIZATION_SERVICE_URL in the host environment.

services.iam.url=${IAM_SERVICE_URL:https://meditrack-iam-gmh0b2eshgcpbmhw.eastus-01.azurewebsites.net}
services.organization.url=${ORGANIZATION_SERVICE_URL:https://meditrack-organization.duckdns.org}

# Comma-separated origins allowed to call the gateway from the browser.
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=${GATEWAY_CORS_ORIGINS:https://*.web.app,https://*.firebaseapp.com,http://localhost:4200,http://localhost:*,https://*.duckdns.org}
