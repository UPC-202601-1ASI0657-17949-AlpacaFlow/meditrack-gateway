spring.application.name=meditrack-gateway

# Single entry point for the frontend (Angular dev server uses localhost:4200)
server.port=${PORT:8088}

# Downstream microservice URLs (override with env vars for deployed backends)
services.iam.url=${IAM_SERVICE_URL:http://localhost:8080}
services.organization.url=${ORGANIZATION_SERVICE_URL:http://localhost:8282}
services.relatives.url=${RELATIVES_SERVICE_URL:http://localhost:8181}
services.clinical.url=${CLINICAL_SERVICE_URL:https://meditrack-clinical-hph0avgbe2ejbyew.eastus-01.azurewebsites.net}

# Routes are defined in GatewayRoutesConfiguration.java (with circuit breakers).

# --- Resilience4j circuit breakers ---
resilience4j.circuitbreaker.instances.iamCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.iamCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.iamCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.iamCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.iamCircuitBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.iamCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.iamCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.organizationCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.organizationCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.organizationCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.organizationCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.organizationCircuitBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.organizationCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.organizationCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.relativesCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.relativesCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.relativesCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.relativesCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.relativesCircuitBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.relativesCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.relativesCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.timelimiter.instances.iamCircuitBreaker.timeoutDuration=15s
resilience4j.timelimiter.instances.organizationCircuitBreaker.timeoutDuration=15s
resilience4j.timelimiter.instances.relativesCircuitBreaker.timeoutDuration=15s

resilience4j.circuitbreaker.instances.clinicalCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.clinicalCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.clinicalCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.clinicalCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.clinicalCircuitBreaker.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.clinicalCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.clinicalCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.timelimiter.instances.clinicalCircuitBreaker.timeoutDuration=15s

# CORS (centralized at the gateway for the frontend)
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=${GATEWAY_CORS_ORIGINS:http://localhost:4200,http://localhost:*,https://*.vercel.app,https://*.netlify.app,https://*.duckdns.org}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# IAM/Organization also send CORS headers; without dedupe the browser sees duplicates and blocks the request
spring.cloud.gateway.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.default-filters[0].args.name=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Expose-Headers Access-Control-Allow-Methods Access-Control-Allow-Headers
spring.cloud.gateway.default-filters[0].args.strategy=RETAIN_FIRST

# Actuator
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers
management.endpoint.health.show-details=when_authorized
management.health.circuitbreakers.enabled=true

spring.cloud.compatibility-verifier.enabled=false
